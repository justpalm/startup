<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>characterselect</title>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header>
      <h1>The Minotaur<sup>&reg;</sup></h1>

      <!-- Navigation elements -->
      <nav>
      <hr />
    </header>

    <main>


      <h1>Choose your Character</h1>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <menu>

          <button type="button" onclick="location.href='weather.html'"><<<</button>
          <img src="startup\characters\character_1.png" alt="Description of the image">
          <button type="button" onclick="location.href='character.html'">>>></button>
    
        </menu>
      </nav>

      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
      



      <form method="get" action="play.html">
        <span>⚔️</span>
        <input type="username" placeholder="Hero's Name" />
        <button type="play">PLAY!!!</button>
      </form>

    </main>

    <footer>
      <hr />
      <span class="text-reset">Author Name:</span>
      <span class="text-reset">Justin Palmer </span>
      <br />
      <a href="https://github.com/justpalm/startup.git">GitHub</a>
    </footer>
  </body>
</html>
