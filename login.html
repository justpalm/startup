<!DOCTYPE html>

    <main>

      <body>


      <h1>Welcome to adventure</h1>

      <div class="wrapper">
      <img src="the_minotuar.png" class="blend" alt="Minotaur" 
      height="600"/>
      </div>
         
        
       <!-- Navigation elements -->
      <h2>Leaderbord:</h2>

      <nav>
        <menu>
        <table>
        <thead>
          <tr>
            <th>#</th>

            <th>Time</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>

          <tr>
            <td>2</td>

          <tr>

          </tr>
          <tr>
            <td>5</td>

            <td>6:04</td>
          </tr>
        </tbody>
        <!-- This is what the database will pull, but for now here's the data-->
        </table>
      </menu>
      </nav>


      <script>
        const images = [
          "characters/character_1.png",
          "characters/character_2.png",
          "characters/character_3.png"
        ];

      const params = new URLSearchParams(window.location.search);
      const index = parseInt(params.get("img")) || 0;

          document.getElementById("character-img").src = images[index];
        </script>

            <form method="get" action="character.html">
              <span>⚔️</span>
              <input type="username" placeholder="Hero's Name" />

            </form>
            <br>
            <button onclick="location.href='weather.html'">Weather?</button>
        </body>
